<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GHOST PROTOCOL // بروتوكول الظل</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050608;
      --card-bg: #0c0f14;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --border: #1a2230;
      --text: #f8fafc;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .hud-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .brand-title { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: #fff; letter-spacing: 1px; }
    .status-pulse { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--accent-green); }
    .dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }

    /* بطاقات الأوامر التكتيكية */
    .tactical-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .tactical-btn:active { transform: scale(0.98); }

    .btn-call { border-color: rgba(239, 68, 68, 0.4); }
    .btn-call:active { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.08); }

    .btn-trigger { border-color: rgba(6, 182, 212, 0.4); }
    .btn-trigger:active { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.08); }

    .btn-content { display: flex; align-items: center; gap: 14px; }
    .btn-icon { font-size: 2rem; }
    .btn-texts h3 { font-size: 1rem; font-weight: 900; color: #fff; }
    .btn-texts p { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .action-tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      padding: 6px 10px;
      border-radius: 8px;
      background: #000;
      border: 1px solid var(--border);
    }

    /* إعدادات سريعة قابلة للتعديل */
    .quick-settings {
      background: #080a0f;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .settings-row span b { color: #fff; }
    .edit-link { color: var(--accent-cyan); cursor: pointer; text-decoration: underline; }

    /* شاشة المكالمة الواردة الواقعية */
    #incomingCallScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999999;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 24px 50px;
      text-align: center;
    }

    .caller-meta { margin-top: 30px; }
    .caller-name { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .caller-type { font-size: 1rem; color: #94a3b8; }

    .call-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }
    .call-action-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      cursor: pointer;
    }
    .btn-decline { background: var(--accent-red); }
    .btn-accept { background: var(--accent-green); animation: pulseGreen 1.5s infinite; }

    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 16px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* حالة المكالمة الجارية */
    #inCallStatus { display: none; font-size: 1.1rem; color: var(--accent-green); font-family: 'Space Mono'; margin-top: 10px; }
  </style>
</head>
<body>

<div class="hud-container" id="mainDashboard">

  <div class="top-bar">
    <div class="brand-title">GHOST PROTOCOL // V1</div>
    <div class="status-pulse"><div class="dot"></div> صامت وجاهز</div>
  </div>

  <!-- الزر الأول: مكالمة الهروب التكتيكية -->
  <div class="tactical-btn btn-call" onclick="triggerStealthCall()">
    <div class="btn-content">
      <div class="btn-icon">📞</div>
      <div class="btn-texts">
        <h3>مكالمة الانسحاب التكتيكي</h3>
        <p>رنين واهتزاز فوري بعد 5 ثوانٍ للانسحاب بهيبة</p>
      </div>
    </div>
    <div class="action-tag" style="color:var(--accent-red);" id="timerLabel">5s</div>
  </div>

  <!-- الزر الثاني: مفتاح التحكم عن بعد والفتح الصامت -->
  <div class="tactical-btn btn-trigger" onclick="triggerRemoteAction()">
    <div class="btn-content">
      <div class="btn-icon">⚡</div>
      <div class="btn-texts">
        <h3>مفتاح الفتح الصامت</h3>
        <p>إرسال أمر فتح / أتمتة سريعة (Remote Trigger)</p>
      </div>
    </div>
    <div class="action-tag" style="color:var(--accent-cyan);">EXECUTE</div>
  </div>

  <!-- إعدادات التخصيص السريعة -->
  <div class="quick-settings">
    <div class="settings-row">
      <span>اسم المتصل: <b id="lblCallerName">الوالد</b></span>
      <span class="edit-link" onclick="updateCallerName()">تعديل</span>
    </div>
    <div class="settings-row">
      <span>رابط التحكم (Webhook): <b id="lblWebhookStatus">غير مضبوط</b></span>
      <span class="edit-link" onclick="updateWebhookUrl()">تعديل الرابط</span>
    </div>
  </div>

</div>

<!-- واجهة المكالمة الواردة الصامتة الواقعية -->
<div id="incomingCallScreen">
  <div class="caller-meta">
    <div class="caller-name" id="callerDisplayName">الوالد</div>
    <div class="caller-type" id="callTypeSubtitle">مكالمة هاتفية واردة...</div>
    <div id="inCallStatus">00:00</div>
  </div>

  <div class="call-controls" id="callControlButtons">
    <button class="call-action-btn btn-decline" onclick="endCallSession()">✕</button>
    <button class="call-action-btn btn-accept" onclick="acceptCallSession()">📞</button>
  </div>
</div>

<script>
  let callerName = localStorage.getItem("GHOST_CALLER") || "الوالد";
  let webhookUrl = localStorage.getItem("GHOST_WEBHOOK") || "";
  let callInterval = null;
  let callSeconds = 0;
  let audioCtx = null;
  let ringInterval = null;

  document.getElementById("lblCallerName").innerText = callerName;
  document.getElementById("callerDisplayName").innerText = callerName;
  if (webhookUrl) document.getElementById("lblWebhookStatus").innerText = "متصل ✔";

  function updateCallerName() {
    const val = prompt("اسم المتصل الذي تريده أن يظهر:", callerName);
    if (val) {
      callerName = val;
      localStorage.setItem("GHOST_CALLER", val);
      document.getElementById("lblCallerName").innerText = val;
      document.getElementById("callerDisplayName").innerText = val;
    }
  }

  function updateWebhookUrl() {
    const url = prompt("الصق رابط الـ Webhook أو صفحة الفتح:", webhookUrl);
    if (url) {
      webhookUrl = url;
      localStorage.setItem("GHOST_WEBHOOK", url);
      document.getElementById("lblWebhookStatus").innerText = "متصل ✔";
    }
  }

  // محاكي نغمة رنين آيفون بدون ملفات خارجية
  function playTacticalRingtone() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      ringInterval = setInterval(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      }, 1000);
    } catch(e) {}
  }

  function stopRingtone() {
    if (ringInterval) clearInterval(ringInterval);
    if (audioCtx) {
      try { audioCtx.close(); } catch(e) {}
      audioCtx = null;
    }
  }

  // تشغيل مكالمة الانسحاب بعد 5 ثوانٍ صامتة
  function triggerStealthCall() {
    let count = 5;
    const btn = document.getElementById("timerLabel");
    btn.innerText = `${count}s...`;
    
    const cd = setInterval(() => {
      count--;
      if (count > 0) {
        btn.innerText = `${count}s...`;
      } else {
        clearInterval(cd);
        btn.innerText = "5s";
        showIncomingScreen();
      }
    }, 1000);
  }

  function showIncomingScreen() {
    document.getElementById("incomingCallScreen").style.display = "flex";
    if (navigator.vibrate) navigator.vibrate([600, 400, 600, 400, 600]);
    playTacticalRingtone();
  }

  function acceptCallSession() {
    stopRingtone();
    document.getElementById("callTypeSubtitle").style.display = "none";
    document.getElementById("inCallStatus").style.display = "block";
    document.getElementById("callControlButtons").innerHTML = `
      <button class="call-action-btn btn-decline" onclick="endCallSession()" style="width:80px;height:80px;">إنهاء</button>
    `;

    callInterval = setInterval(() => {
      callSeconds++;
      const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      const s = String(callSeconds % 60).padStart(2, '0');
      document.getElementById("inCallStatus").innerText = `${m}:${s}`;
    }, 1000);
  }

  function endCallSession() {
    stopRingtone();
    if (callInterval) clearInterval(callInterval);
    callSeconds = 0;
    document.getElementById("incomingCallScreen").style.display = "none";
    document.getElementById("callTypeSubtitle").style.display = "block";
    document.getElementById("inCallStatus").style.display = "none";
    document.getElementById("callControlButtons").innerHTML = `
      <button class="call-action-btn btn-decline" onclick="endCallSession()">✕</button>
      <button class="call-action-btn btn-accept" onclick="acceptCallSession()">📞</button>
    `;
  }

  // تنفيذ أمر التحكم الصامت
  function triggerRemoteAction() {
    if (!webhookUrl) {
      alert("⚠️ يرجى تعيين رابط الـ Webhook أو الصفحة المراد فتحها أولاً من أسفل الشاشة.");
      return;
    }
    // إرسال طلب صامت بالخلفية أو فتحه
    fetch(webhookUrl, { mode: 'no-cors' })
      .then(() => alert("⚡ تم إرسال الأمر بنجاح!"))
      .catch(() => window.open(webhookUrl, '_blank'));
  }
</script>

</body>
</html>
